{% extends "main.html" %} {% block content %}

<main class="create-room layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{% url 'home' %}">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
              <title>arrow-left</title>
              <path
                d="M13.723 2.286l-13.723 13.714 13.719 13.714 1.616-1.611-10.96-10.96h27.625v-2.286h-27.625l10.965-10.965-1.616-1.607z"></path>
            </svg>
          </a>
          <h3>{% if room.id %}Update Sprint{% else %}Launch a New Sprint{% endif %}</h3>
        </div>
      </div>
      <div class="layout__body">
        <form class="form" action="" method="POST">
          {% csrf_token %}
          <div class="form__group">
            <label for="room_topic">Topic / Technology Stack</label>
            <input
              required
              type="text"
              name="topic"
              value="{{room.topic.name}}"
              list="topic_list"
              placeholder="e.g. Django, React, Python, PostgreSQL..." />
            <datalist id="topic_list">
              <select id="room_topic">
                {% for topic in topics %}
                <option value="{{topic.name}}">{{topic.name}}</option>
                {% endfor %}
              </select>
            </datalist>
          </div>

          <div class="form__group">
            <label for="room_name">Sprint Title</label>
            {{form.name}}
          </div>

          <div class="form__group">
            <label for="room_description">Sprint Goals & Details</label>
            {{form.description}}
          </div>

          <div class="form__group">
            <label for="github_url">GitHub Repository URL (Optional)</label>
            <input
              type="url"
              name="github_url"
              id="github_url"
              value="{{room.github_url|default:''}}"
              placeholder="https://github.com/username/project" />
          </div>

          <div class="form__group">
            <label for="demo_url">Live Demo URL (Optional)</label>
            <input
              type="url"
              name="demo_url"
              id="demo_url"
              value="{{room.demo_url|default:''}}"
              placeholder="https://yourproject.com" />
          </div>

          {% if room.id %}
          <div class="form__group" style="flex-direction: row; align-items: center; gap: 1rem; padding: 1rem 0;">
            <input
              type="checkbox"
              name="is_completed"
              id="is_completed"
              style="width: 2rem; height: 2rem; accent-color: var(--color-main);"
              {% if room.is_completed %}checked{% endif %} />
            <label for="is_completed" style="text-transform: none; font-size: 1.4rem; cursor: pointer; margin: 0;">
              🏁 <strong>Mark Sprint as Shipped / Completed</strong>
            </label>
          </div>
          {% endif %}

          <div class="form__action">
            <a class="btn btn--dark" href="{% url 'home' %}">Cancel</a>
            <button class="btn btn--main" type="submit">{% if room.id %}Save Changes{% else %}Launch Sprint{% endif %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
